name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Offline retrieval evaluation
        run: make evaluate

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: artifacts/retrieval-evaluation.json

      - name: Offline claim-support fixture validation
        run: make support-evaluate

      - name: Security audit
        run: make security

      - name: Smoke
        run: make smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: make docker-build
